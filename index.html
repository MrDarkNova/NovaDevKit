<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DarkNova Dev Kit — JSON, JWT, hashes, regex &amp; more</title>
  <meta name="description" content="Private, in-browser developer tools: JSON formatter, Base64, URL, SHA hashes and HMAC, JWT decoder and verifier, UUID/ULID/password generator, timestamps, regex tester and color contrast. Nothing is uploaded." />
  <meta name="theme-color" content="#100e0c" />
  <meta property="og:title" content="DarkNova Dev Kit" />
  <meta property="og:description" content="Nine developer tools that run entirely in your browser." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,520&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip" href="#stage">Skip to tool</a>
  <aside>
    <div class="top">
      <p class="mark" aria-hidden="true">DN</p>
      <p class="brand">DEV KIT</p>
    </div>
    <label class="sr" for="find">Find a tool</label>
    <input id="find" class="find" type="search" placeholder="Find a tool…  ( / )" autocomplete="off" />
    <nav id="tabs" aria-label="Tools"></nav>
    <p class="hint">Runs in this tab. Nothing is uploaded or stored.</p>
  </aside>
  <main>
    <header>
      <p class="eyebrow">MR. DARKNOVA</p>
      <h1 id="title">JSON</h1>
      <p class="lede" id="lede"></p>
    </header>
    <div id="stage" tabindex="-1"></div>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Dev Kit needs JavaScript to run its tools.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
