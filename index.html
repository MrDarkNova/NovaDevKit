<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Dev Kit</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="wrap">
    <header>
      <p class="eyebrow">MR. DARKNOVA</p>
      <h1>DEV <span>KIT</span></h1>
      <p class="sub">JSON, Base64, UUID, color. Runs in this tab only.</p>
    </header>
    <section>
      <h2>JSON</h2>
      <textarea id="jsonIn" rows="6" placeholder='{"ok":true}'></textarea>
      <div class="row">
        <button id="jsonBtn">Format</button>
        <button class="ghost" id="jsonMin">Minify</button>
        <button class="ghost" id="jsonCopy">Copy</button>
      </div>
      <pre id="jsonOut"></pre>
    </section>
    <section>
      <h2>Base64</h2>
      <textarea id="b64In" rows="3" placeholder="text"></textarea>
      <div class="row">
        <button id="encBtn">Encode</button>
        <button class="ghost" id="decBtn">Decode</button>
      </div>
      <pre id="b64Out"></pre>
    </section>
    <section>
      <h2>UUID + color</h2>
      <div class="row"><button id="uuidBtn">New UUID</button><code id="uuidOut"></code></div>
      <div class="row"><input id="color" type="color" value="#7c5cfc" /><code id="hexOut">#7c5cfc</code></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
